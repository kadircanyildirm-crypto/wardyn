[package]
name = "wardyn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A kernel-level warden for AI coding agents — eBPF watches every file, exec, and network connection an agent makes, and blocks policy violations in real time."
keywords = ["ebpf", "security", "sandbox", "bpf", "agent"]
categories = ["command-line-utilities", "development-tools", "os::linux-apis"]

[dependencies]
aya = { workspace = true }
wardyn-common = { workspace = true }
# The policy engine and CLI live in a portable crate so they stay testable off
# Linux; this crate is the Linux-only half that talks to the kernel.
wardyn-policy = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "signal", "net", "process", "time"] }
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
aya-build = "0.2"
anyhow = { workspace = true }

[[bin]]
name = "wardyn"
path = "src/main.rs"
