# Strict preset — deny-all egress, block a broad set of secrets and reverse-shell
# tools. Use with:
#   sudo wardyn --enforce --policy policies/strict.yaml run -- <agent>
version: 1
default_action: allow

files:
  - { match: "**/.env", action: block }
  - { match: "**/.env.*", action: block }
  - { match: "**/.ssh/**", action: block }
  - { match: "**/.aws/**", action: block }
  - { match: "**/.config/gcloud/**", action: block }
  # Use directory form (**/dir/**) not **/.kube/config: the kernel matcher keys on
  # the basename, so `.../config` would reduce to "deny ANY file named config" and
  # also block .git/config — contradicting the warn rule below. The dir form keys
  # on `.kube`/`.docker` instead.
  - { match: "**/.kube/**", action: block }
  - { match: "**/.docker/**", action: block }
  - { match: "**/.netrc", action: block }
  - { match: "**/.npmrc", action: block }
  - { match: "**/.pypirc", action: block }
  - { match: "/etc/shadow", action: block }
  - { match: "**/.git/config", action: warn }

  # Identity rules. Every `match:` rule above keys on a NAME, and a name comes
  # off with one `mv`. These pin the same secrets by `(dev, ino)` — the object
  # itself — so a rename or a hard link does not shake the rule off, and a copy
  # cannot help either because copying means reading, and the read is denied.
  #
  # They resolve when the policy loads: `~` is the *agent's* home (not root's,
  # even under sudo) and a bare name is relative to the directory wardyn is
  # launched in. A path that does not exist is reported at startup and by
  # `--dry-run`, and pins nothing — the `match:` rule above still covers it if
  # it appears later. Run `wardyn --dry-run` from your project to see exactly
  # which objects these landed on.
  - { path: "~/.ssh", action: block }
  - { path: "~/.aws", action: block }
  - { path: "~/.kube", action: block }
  - { path: "~/.docker", action: block }
  - { path: "~/.netrc", action: block }
  - { path: ".env", action: block }
  - { path: "/etc/shadow", action: block }

  - { match: "**", action: allow }

network:
  - { cidr: "127.0.0.0/8", action: allow }
  - { cidr: "10.0.0.0/8", action: allow }
  - { cidr: "172.16.0.0/12", action: allow }
  - { cidr: "192.168.0.0/16", action: allow }
  - { cidr: "::1/128", action: allow } # IPv6 loopback
  - { cidr: "fc00::/7", action: allow } # IPv6 unique-local (private)
  - { cidr: "fe80::/10", action: allow } # IPv6 link-local
  - { domain: "github.com", action: allow }
  - { domain: "api.anthropic.com", action: allow }
  - { domain: "registry.npmjs.org", action: allow }
  - { cidr: "0.0.0.0/0", action: block } # deny everything else (IPv4)
  - { cidr: "::/0", action: block } # deny everything else (IPv6 + v4-mapped)

exec:
  - { match: "**/nc", action: block }
  - { match: "**/ncat", action: block }
  - { match: "**/socat", action: block }
  - { match: "**/telnet", action: block }
  - { match: "**/curl", action: warn }
  - { match: "**/wget", action: warn }
  - { match: "**", action: allow }
