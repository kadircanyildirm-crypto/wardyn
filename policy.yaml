# Wardyn policy — what the watched process tree is allowed to do.
# Each section is an ordered list; the FIRST matching rule wins.
# If nothing matches, `default_action` applies.
# Actions: allow | warn | block
version: 1

default_action: allow

# ── File access ────────────────────────────────────────────────
# Two forms, answering two different questions:
#
#   match:  a glob over the path's NAMES (** spans directories). Covers files
#           that do not exist yet — but a name comes off with one `mv`.
#   path:   one concrete object, pinned by `(dev, ino)` when the policy loads.
#           Survives rename and hard-link; cannot cover what is not there yet.
#           `~` is the agent's home; a bare name is relative to where wardyn was
#           launched. `wardyn --dry-run` prints exactly which objects it found.
#
# They complement each other, so use both for anything that matters. See
# policies/strict.yaml for a fuller identity-pinned set.
files:
  - { match: "**/.env", action: block }
  - { match: "**/.env.*", action: block }
  - { match: "**/.ssh/**", action: block }
  - { match: "**/.aws/credentials", action: block }
  - { match: "**/.config/gcloud/**", action: block }
  - { match: "/etc/shadow", action: block }
  # The same secrets, pinned by identity rather than by name.
  - { path: "~/.ssh", action: block }
  - { path: "/etc/shadow", action: block }
  - { match: "**/.npmrc", action: warn }
  - { match: "**/.git/config", action: warn }
  - { match: "**", action: allow } # everything else: reading is fine

# ── Outbound network ───────────────────────────────────────────
# Match by `cidr` (IP range) or `domain` (resolved to IPs at load time).
network:
  # IPv4
  - { cidr: "127.0.0.0/8", action: allow } # loopback
  - { cidr: "10.0.0.0/8", action: allow } # private LAN
  - { cidr: "172.16.0.0/12", action: allow }
  - { cidr: "192.168.0.0/16", action: allow }
  # IPv6 — mirror the private/loopback allows, or the v6 deny-all below blocks them
  - { cidr: "::1/128", action: allow } # loopback
  - { cidr: "fc00::/7", action: allow } # unique-local (private)
  - { cidr: "fe80::/10", action: allow } # link-local
  # Allowed services (each resolves to A *and* AAAA records at load)
  - { domain: "api.anthropic.com", action: allow }
  - { domain: "registry.npmjs.org", action: allow }
  - { domain: "github.com", action: allow }
  # Deny all other egress — BOTH families. Without the ::/0 rule, every IPv6
  # destination (and IPv4-mapped ::ffff: from dual-stack sockets) would be allowed.
  - { cidr: "0.0.0.0/0", action: block }
  - { cidr: "::/0", action: block }

# ── Process execution ──────────────────────────────────────────
# `match` is a glob against the executable path being exec'd.
exec:
  - { match: "**/nc", action: block } # netcat / reverse shells
  - { match: "**/ncat", action: block }
  - { match: "**/curl", action: warn }
  - { match: "**/wget", action: warn }
  - { match: "**", action: allow }
