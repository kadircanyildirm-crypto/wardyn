name: Security audit

# Every branch, like CI and the E2E. A dependency change is exactly what this
# workflow exists to review, and reviewing it only after the merge means the
# licences and advisories of a new subtree are read once it is already in.
on:
  push:
    branches: ["**"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # Weekly, so newly-disclosed advisories are caught even without a code change.
    - cron: "27 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
