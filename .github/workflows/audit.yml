name: Security audit

# Every branch, like CI and the E2E. A dependency change is exactly what this
# workflow exists to review, and reviewing it only after the merge means the
# licences and advisories of a new subtree are read once it is already in.
on:
  push:
    branches: ["**"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  # No `paths:` filter here, unlike the push trigger above. `cargo-deny` is a
  # REQUIRED status check on `main`, and a required check that is path-filtered
  # never reports on a pull request that does not touch those paths — GitHub
  # then waits for a status that will never arrive, and the branch cannot be
  # merged at all. The filter saved under a minute per run and cost every
  # dependency-free pull request its merge button.
  pull_request:
  schedule:
    # Weekly, so newly-disclosed advisories are caught even without a code change.
    - cron: "27 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources
